[tools]
rust = { version = "1.98.0", profile = "minimal", components = "clippy,rustfmt" }
node = "24.19.0"
pnpm = "11.24.0"
python = "3.14.7"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"

[settings.zig]
use_community_mirrors = false

[env]
CARGO_INCREMENTAL = "0"
CARGO_BUILD_JOBS = "2"
CARGO_TARGET_DIR = "{{config_root}}/target"

[tasks.setup]
description = "Install workspace dependencies from the committed lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Build Server, Web Console and documentation"
run = [{ task = "build:server" }, { task = "build:node" }, { task = "build:console" }, { task = "build:docs" }]

[tasks.check]
description = "Run the complete CI checks: the Cargo chain and the web chain in parallel"
depends = ["check:cargo", "check:web"]

[tasks."check:cargo"]
description = "Rust checks, tests, codegen, contract drift and SDK consumers in order (shared Cargo target)"
run = [
  { task = "check:rust" },
  { task = "test:rust" },
  { task = "test:codegen" },
  { task = "check:protocol" },
  { task = "check:sdk" },
]

[tasks."check:web"]
description = "Web Console checks, tests and build, scripts tests and docs in order (no Cargo)"
run = [
  { task = "check:console" },
  { task = "test:console" },
  { task = "build:console" },
  { task = "test:scripts" },
  { task = "check:docs" },
]

[tasks."check:rust"]
description = "Check test file bounds, Rust formatting and strict Clippy for every target/feature"
run = [
  "python3 scripts/check_test_files.py",
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
  { task = "check:linux" },
]

[tasks."check:linux"]
description = "On macOS, strict Clippy for the Linux musl target so Linux-only modules (underlay, DNS, TUN) are checked before CI"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "if [ \"$(uname)\" = Darwin ]; then cargo-zigbuild clippy --workspace --all-targets --all-features --locked --target aarch64-unknown-linux-musl -- -D warnings; else echo 'host is Linux; native Clippy already covers Linux-only modules'; fi"

[tasks."check:fast"]
description = "Development gate: fmt, strict Clippy and the fast nextest profile (no real-time waits)"
run = [
  { task = "check:rust" },
  { task = "test:fast" },
]

[tasks."test:fast"]
description = "nextest `fast` profile: all tests except the measured >=5 s real-time contracts"
env = { RUST_MIN_STACK = "8388608" }
# This virtual workspace defaults to all members. Forcing --workspace would
# override the documented `-- -p <crate>` package selection during iteration.
run = "umask 077; cargo nextest run --all-targets --all-features --locked --profile fast"

[tasks."test:rust"]
description = "Test every Rust target/feature with nextest, then Rust doctests"
env = { RUST_MIN_STACK = "8388608" }
run = [
  "umask 077; cargo nextest run --workspace --all-targets --all-features --locked --profile \"${NEXTEST_PROFILE:-default}\"",
  "cargo test --workspace --all-features --locked --doc",
]

[tasks."build:server"]
description = "Build the Server binary used by local services and SDK tests"
run = "cargo build -p meshway-server --bin meshway-server --locked"

[tasks."build:node"]
description = "Build meshwayd and the meshway local CLI"
run = "cargo build -p meshway-daemon -p meshway-cli --bins --locked"

[tasks."build:node:linux"]
description = "Cross-build Linux Node binaries on the host for the persistent Docker lab"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "python3 scripts/node_lab.py build"

[tasks."node:lab"]
description = "Ubuntu TUN Nodes: image-build|deploy|configure|versions|status|stop; deploy never builds"
run = "python3 scripts/node_lab.py"

[tasks."test:tun:linux"]
description = "Explicit real Linux TUN verification in a disposable isolated container"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "python3 scripts/verify_tun.py"

[tasks."test:packet:linux"]
description = "Explicit protected TUN packet conformance in disposable isolated Linux namespaces"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "python3 scripts/verify_packet.py"

[tasks."perf:transport"]
description = "Explicit release raw/datagram transport measurements and JSON/Markdown reports"
run = "python3 scripts/perf/transport.py"

[tasks."perf:circuit"]
description = "Explicit release in-process protected circuit CPU measurements (L0)"
run = "python3 scripts/perf/circuit.py"

[tasks."perf:crypto"]
description = "Explicit release cryptographic primitive CPU measurements on host and Linux"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "python3 scripts/perf/crypto.py"

[tasks."perf:crypto:l0"]
description = "Explicit release L0 CPU profiling using samply or existing instrumentation"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "python3 scripts/perf/crypto_l0.py"

[tasks."perf:crypto:attribute"]
description = "Combine perf:crypto and host/linux perf:crypto:l0 runs into the L0 CPU attribution report"
run = "python3 scripts/perf/crypto_analysis.py"

[tasks."perf:dataplane"]
description = "Explicit isolated Linux raw/plain TUN dataplane measurements"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "python3 scripts/perf/dataplane.py"

[tasks."test:runtime:linux"]
description = "Explicit real daemon/CLI and owned underlay conformance in disposable Linux namespaces"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "python3 scripts/verify_runtime.py"

[tasks."validate:matrix"]
description = "Build once and run the isolated Linux acceptance matrix with bounded concurrency"
tools = { zig = "0.17.0", "github:rust-cross/cargo-zigbuild" = "0.23.4" }
run = "python3 scripts/validate_matrix.py"

[tasks."validate:remote"]
description = "Run a pushed matrix revision remotely and retrieve private evidence; supports --attach"
run = "python3 scripts/validate_remote.py"

[tasks."generate:protocol"]
description = "Generate OpenAPI and Rust/TypeScript clients from actual routes"
run = "pnpm --filter @meshway/control-client generate"

[tasks."check:protocol"]
description = "Check generated contract/client drift"
run = "pnpm --filter @meshway/control-client check:generated"

[tasks."test:codegen"]
description = "Test schema generation and TypeScript consumers"
run = "node --test scripts/protocol/generate.test.mjs"

[tasks."check:sdk"]
description = "Type-check browser/Node consumers and test against the real Server"
run = [
  { task = "build:server" },
  "pnpm --filter @meshway/control-client typecheck",
  "pnpm --filter @meshway/control-client test",
]

[tasks."check:console"]
description = "Check Web Console types, lint and formatting"
run = "pnpm --filter @meshway/web-console check"

[tasks."test:console"]
description = "Run Web Console domain tests"
run = "pnpm --filter @meshway/web-console test"

[tasks."build:console"]
description = "Build the Web Console SPA"
run = "pnpm --filter @meshway/web-console build"

[tasks."check:docs"]
description = "Build docs and check links, anchors, contracts and examples"
run = "pnpm --filter @meshway/docs check"

[tasks."build:docs"]
description = "Build the documentation site"
run = "pnpm --filter @meshway/docs build"

[tasks."test:scripts"]
description = "Test local service ownership and lifecycle helpers"
run = [
  "python3 -B -m unittest discover -s scripts -p 'test_*.py'",
  "python3 -B -m unittest discover -s scripts/perf -p 'test_*.py'",
  "python3 -B -m unittest discover -s dev/traversal-fixture -p 'test_*.py'",
  "pnpm exec tsc -p scripts/dev/tsconfig.json",
  "node --experimental-strip-types --test scripts/dev/seed.test.ts",
]

[tasks."dev:console"]
description = "Run Web Console; requires MESHWAY_CONTROLLER_URL"
run = "pnpm --filter @meshway/web-console dev"

[tasks."dev:docs"]
description = "Run the documentation dev server in the foreground"
run = "pnpm --filter @meshway/docs dev"

[tasks."status:sync"]
description = "Sync the ci-results summary index into the local documentation site"
run = "python3 scripts/ci/collect.py --sync"

[tasks.services]
description = "Manage Server/docs: start|status|stop|restart|update [server|docs|all], or reset server"
run = "python3 scripts/dev.py"
