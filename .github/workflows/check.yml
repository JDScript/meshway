name: Check

on:
  workflow_dispatch:
  push:
  pull_request:

# Runners may carry a personal global mise config; the project lockfile is the only tool source.
env:
  MISE_GLOBAL_CONFIG_ROOT: /nonexistent

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      protocol: ${{ steps.filter.outputs.protocol }}
      web: ${{ steps.filter.outputs.web }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "Cargo.toml"
              - "Cargo.lock"
              - "mise.toml"
              - "mise.lock"
              - ".config/nextest.toml"
              - "crates/**"
              - "apps/meshway-server/**"
              - "apps/meshway-daemon/**"
              - "apps/meshway-cli/**"
              - "tools/**"
            protocol:
              - "packages/**"
              - "scripts/protocol/**"
            web:
              - "apps/meshway-web-console/**"
              - "apps/meshway-web-site/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "package.json"
              - "mise.toml"
              - "mise.lock"
              - "docs/**"
              - "scripts/**"
              - "dev/**"
            workflows:
              - ".github/**"

  cargo:
    # Rust checks, tests, codegen, contract drift and SDK consumers. Protocol
    # changes land here too because the generated clients are produced from
    # the real routes.
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.protocol == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14
          install_args: --locked
      - run: mise run setup
      - run: mise run check:cargo

  web:
    # The same check:web chain as local `mise run check`: shared UI, Console,
    # site, scripts tests and docs. No Cargo. SDK changes run it too because
    # the Console and site consume the generated client and the docs validate
    # OpenAPI examples against the committed contract.
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.protocol == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14
          install_args: --locked
      - run: mise run setup
      - run: mise run check:web
