name: Status

on:
  workflow_run:
    workflows: [Check, Validate, Perf, Build]
    types: [completed]
  workflow_dispatch:

# Runners may carry a personal global mise config; the project lockfile is the only tool source.
env:
  MISE_GLOBAL_CONFIG_ROOT: /nonexistent

permissions:
  actions: read
  contents: write

concurrency:
  group: status-index
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch != 'ci-results'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      # workflow_run always executes the collector from the default branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          install_args: --locked python
      - name: Collect and publish summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec python -- python3 scripts/ci/collect.py --publish --push
      - name: Summary
        run: echo "Status index updated on ci-results; locally run mise run status:sync." >> "$GITHUB_STEP_SUMMARY"
