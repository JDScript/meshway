name: Build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - "crates/**"
      - "apps/meshway-daemon/**"
      - "apps/meshway-cli/**"
      - "apps/meshway-server/**"
      - "tools/meshway-rules-cli/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  # Release reuses exactly this build for the tagged commit.
  workflow_call:

# Runners may carry a personal global mise config; the project lockfile is the only tool source.
env:
  MISE_GLOBAL_CONFIG_ROOT: /nonexistent

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every job reads; only the job that creates a Release writes (release.yml).
permissions:
  contents: read

jobs:
  node-linux:
    # Cross-compiles release Node and Server binaries for both Linux targets on
    # the build host; no containers or measurements run here.
    runs-on: [self-hosted, linux, x64, build]
    timeout-minutes: 60
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tags make `meshway version` report a git description, not a bare hash.
          fetch-depth: 0
      - name: Record git description
        run: echo "MESHWAY_GIT_DESCRIBE=$(git describe --tags --always --dirty --abbrev=8)" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          install_args: --locked
      - run: mise run setup
      - run: rustup target add ${{ matrix.target }}
      - name: Cross-build meshwayd, meshway and meshway-rules
        run: mise exec zig@0.17.0 "github:rust-cross/cargo-zigbuild@0.23.4" -- cargo zigbuild --release --locked --target ${{ matrix.target }} -p meshway-daemon -p meshway-cli -p meshway-rules-cli
      # A separate invocation: the Server's dependency features do not unify
      # into the Node programs. rusqlite's bundled SQLite is compiled by zig cc.
      - name: Cross-build meshway-server, ip-datasets and reset-password
        run: mise exec zig@0.17.0 "github:rust-cross/cargo-zigbuild@0.23.4" -- cargo zigbuild --release --locked --target ${{ matrix.target }} -p meshway-server --bin meshway-server --bin ip-datasets --bin reset-password
      - name: Record sizes and hashes
        run: |
          out=target/${{ matrix.target }}/release
          { echo "## ${{ matrix.target }}"; for b in meshwayd meshway meshway-rules meshway-server ip-datasets reset-password; do printf '%s %s bytes sha256=%s\n' "$b" "$(stat -c %s $out/$b)" "$(sha256sum $out/$b | cut -c1-16)"; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/meshwayd
            target/${{ matrix.target }}/release/meshway
            target/${{ matrix.target }}/release/meshway-rules
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/meshway-server
            target/${{ matrix.target }}/release/ip-datasets
            target/${{ matrix.target }}/release/reset-password
          retention-days: 14
