name: Linux transport laboratory

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build native Linux experimental agent
        run: docker build -f apps/agent/Dockerfile.lab -t meshway-agent-lab:local .
      - name: Exercise native UDP and reverse-dialed VLESS with real IP traffic
        run: >-
          python3 experiments/transport/meshway.py
          --image meshway-agent-lab:local
          --output "$RUNNER_TEMP/meshway-transport.json"
      - name: Preserve non-secret measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-transport-results
          path: ${{ runner.temp }}/meshway-transport.json
          if-no-files-found: ignore
