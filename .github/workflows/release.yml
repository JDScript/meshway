name: Release

on:
  push:
    tags: ["v*"]
  # A dry run on any branch: the same build, gate and packaging; the assets
  # are a workflow artifact, and nothing is published.
  workflow_dispatch:

# Runners may carry a personal global mise config; the project lockfile is the only tool source.
env:
  MISE_GLOBAL_CONFIG_ROOT: /nonexistent

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every job reads; only the job that creates a Release writes (release.yml).
permissions:
  contents: read

jobs:
  version:
    # The tag must name the workspace version exactly, and the changelog must
    # carry a section for it; nothing is built otherwise.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" || { echo "no [workspace.package] version in Cargo.toml"; exit 1; }
          if [ "$EVENT" = push ]; then
            test "$TAG" = "v$version" || { echo "tag $TAG does not match workspace version $version (expected v$version)"; exit 1; }
            grep -qxF "## $TAG" docs/v2/changelog.md || { echo "docs/v2/changelog.md has no '## $TAG' section"; exit 1; }
          else
            TAG=v$version
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case $version in *-*) echo prerelease=true ;; *) echo prerelease=false ;; esac >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  console:
    # The Console SPA, served by the same-origin reverse proxy in front of the
    # Server (the Server serves no static files).
    needs: version
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          install_args: --locked
      - run: mise run setup
      - run: mise run build:console
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-${{ github.sha }}
          path: apps/meshway-web-console/dist/
          retention-days: 14

  server-upgrade:
    # Release gate: the previous release's Server (its asset, or built from
    # its tag when it published none) is upgraded to this build's x86_64
    # program with a control-only Node of this build; see
    # scripts/ci/server-upgrade.py.
    needs: [version, build]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          install_args: --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-x86_64-unknown-linux-musl-${{ github.sha }}"
          path: artifacts
      - name: Upgrade from the previous release
        run: |
          set -eu
          node=artifacts/node-x86_64-unknown-linux-musl-$GITHUB_SHA
          server=artifacts/server-x86_64-unknown-linux-musl-$GITHUB_SHA
          chmod 0755 "$node/meshwayd" "$node/meshway" "$server/meshway-server"
          mise exec -- python3 scripts/ci/server-upgrade.py --current-server "$server/meshway-server" \
            --node-bin "$node" --report server-upgrade.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-upgrade-${{ github.sha }}
          path: server-upgrade.json
          if-no-files-found: ignore
          retention-days: 14

  package:
    # Read-only like every job but `publish`: on workflow_dispatch nothing
    # here can write to the repository.
    needs: [version, build, console, server-upgrade]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-${{ github.sha }}"
          path: artifacts
      - name: Package release assets
        run: |
          set -eu
          mkdir -p release
          mtime="@$(git log -1 --format=%ct)"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            stage=$(mktemp -d)
            cp "artifacts/node-$target-$GITHUB_SHA/meshwayd" "artifacts/node-$target-$GITHUB_SHA/meshway" "$stage/"
            cp dist/systemd/meshwayd.service "$stage/"
            chmod 0755 "$stage/meshwayd" "$stage/meshway"
            chmod 0644 "$stage/meshwayd.service"
            tar --owner=0 --group=0 --numeric-owner --sort=name --mtime="$mtime" \
              -C "$stage" -czf "release/meshway-$target.tar.gz" meshwayd meshway meshwayd.service
            rm -rf "$stage"
            stage=$(mktemp -d)
            for program in meshway-server ip-datasets reset-password; do
              cp "artifacts/server-$target-$GITHUB_SHA/$program" "$stage/"
              chmod 0755 "$stage/$program"
            done
            cp dist/systemd/meshway-server.service "$stage/"
            chmod 0644 "$stage/meshway-server.service"
            tar --owner=0 --group=0 --numeric-owner --sort=name --mtime="$mtime" \
              -C "$stage" -czf "release/meshway-server-$target.tar.gz" ip-datasets meshway-server meshway-server.service reset-password
            rm -rf "$stage"
          done
          tar --owner=0 --group=0 --numeric-owner --sort=name --mtime="$mtime" \
            -C "artifacts/console-$GITHUB_SHA" -czf release/meshway-console.tar.gz .
          cp dist/install.sh release/install.sh
          (cd release && sha256sum -- * > SHA256SUMS)
          # The x86_64 CLI and Server run here: their reported version must be the tag.
          dir=$(mktemp -d)
          tar -xzf release/meshway-x86_64-unknown-linux-musl.tar.gz -C "$dir" meshway
          reported=$("$dir/meshway" version | sed -n '1s/^meshway \([^ ]*\) .*/\1/p')
          test "v$reported" = "$TAG" || { echo "built CLI reports $reported, tag is $TAG"; exit 1; }
          "$dir/meshway" version
          tar -xzf release/meshway-server-x86_64-unknown-linux-musl.tar.gz -C "$dir" meshway-server
          reported=$("$dir/meshway-server" --version | sed -n '1s/^meshway-server \([^ ]*\) .*/\1/p')
          test "v$reported" = "$TAG" || { echo "built Server reports $reported, tag is $TAG"; exit 1; }
          "$dir/meshway-server" --version
          rm -rf "$dir"
          {
            echo "## Release assets"
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ github.sha }}
          path: release/
          retention-days: 14

  publish:
    # The only job with write access, and only for a pushed tag: it creates
    # the GitHub Release from the packaged assets.
    if: github.event_name == 'push'
    needs: [version, package]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ github.sha }}
          path: release
      - name: Release notes from the changelog
        run: |
          set -eu
          awk -v heading="## $TAG" '$0 == heading { keep = 1; next } keep && /^## / { exit } keep' docs/v2/changelog.md > release-notes.md
          grep -q . release-notes.md || { echo "empty changelog section for $TAG"; exit 1; }
          # Site-relative doc links point at the tagged sources on GitHub.
          sed -i -E "s|\]\(/v2/([^)#]*)(#[^)]*)?\)|](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/v2/\1.md\2)|g" release-notes.md
          printf '\nInstall: see `docs/v2/install.md`. Verify assets with `sha256sum -c SHA256SUMS`.\n' >> release-notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/meshway-x86_64-unknown-linux-musl.tar.gz
            release/meshway-aarch64-unknown-linux-musl.tar.gz
            release/meshway-server-x86_64-unknown-linux-musl.tar.gz
            release/meshway-server-aarch64-unknown-linux-musl.tar.gz
            release/meshway-console.tar.gz
            release/install.sh
            release/SHA256SUMS

  rules-cli:
    # meshway-org/meshway-rules runs this converter from its own release
    # `cli-<tag>` (this repository is private). The push token lives only in
    # environment Production.
    if: github.event_name == 'push'
    needs: [version, build, publish]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    environment: Production
    env:
      TAG: ${{ github.ref_name }}
      RULES_REPO: meshway-org/meshway-rules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-x86_64-unknown-linux-musl-${{ github.sha }}
          path: artifacts
      - name: Package meshway-rules
        run: |
          set -eu
          mkdir -p rules-release
          stage=$(mktemp -d)
          cp artifacts/meshway-rules "$stage/"
          chmod 0755 "$stage/meshway-rules"
          reported=$("$stage/meshway-rules" --version | sed -n '1s/^meshway-rules \([^ ]*\)$/\1/p')
          test "v$reported" = "$TAG" || { echo "built meshway-rules reports $reported, tag is $TAG"; exit 1; }
          tar --owner=0 --group=0 --numeric-owner --sort=name --mtime="@$(git log -1 --format=%ct)" \
            -C "$stage" -czf rules-release/meshway-rules-x86_64-unknown-linux-musl.tar.gz meshway-rules
          rm -rf "$stage"
          (cd rules-release && sha256sum -- * > SHA256SUMS)
          {
            echo "## meshway-rules cli-$TAG"
            echo '```'
            cat rules-release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Push the converter release to meshway-rules
        # Plain REST so the job does not depend on `gh` being installed on
        # whichever self-hosted x64 runner picks it up.
        env:
          GH_TOKEN: ${{ secrets.MESHWAY_RULES_PUSH_TOKEN }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -eu
          test -n "$GH_TOKEN" || { echo "MESHWAY_RULES_PUSH_TOKEN is not available in environment Production"; exit 1; }
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          notes="Converter for publish.yml: meshway-rules ${TAG#v}, x86_64-unknown-linux-musl, from the Meshway $TAG release ($GITHUB_SHA). Verify with \`sha256sum -c SHA256SUMS\`; publish.yml pins the archive's SHA-256."
          body=$(python3 -c 'import json,os,sys; print(json.dumps({"tag_name": "cli-"+os.environ["TAG"], "target_commitish": "main", "name": "meshway-rules CLI "+os.environ["TAG"], "body": sys.argv[1], "prerelease": os.environ["PRERELEASE"] == "true"}))' "$notes")
          release=$(api -X POST "https://api.github.com/repos/$RULES_REPO/releases" -d "$body")
          upload_url=$(printf '%s' "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
          for f in meshway-rules-x86_64-unknown-linux-musl.tar.gz SHA256SUMS; do
            api -X POST -H "Content-Type: application/octet-stream" --data-binary "@rules-release/$f" "$upload_url?name=$f" > /dev/null
          done
          echo "created cli-$TAG with 2 assets"
