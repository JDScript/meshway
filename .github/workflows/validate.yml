name: Validate

on:
  # Merges to main are validated on planck before they land (mise run validate:remote);
  # a second full matrix per push only competes with that and with the host's other
  # tenants. The nightly run catches drift; dispatch runs on demand.
  schedule:
    - cron: "17 8 * * *"
  pull_request:
    paths:
      # Every crate of the validated binaries; scripts/test_validate_workflow.py
      # checks this list against the workspace members.
      - "crates/meshway-model/**"
      - "crates/meshway-protocol/**"
      - "crates/meshway-control-client/**"
      - "crates/meshway-private-storage/**"
      - "crates/meshway-logging/**"
      - "crates/meshway-build/**"
      - "crates/meshway-configuration/**"
      - "crates/meshway-policy/**"
      - "crates/meshway-rules/**"
      - "crates/meshway-engine/**"
      - "crates/meshway-connectivity/**"
      - "crates/meshway-control/**"
      - "crates/meshway-underlay/**"
      - "crates/meshway-dataplane/**"
      - "crates/meshway-dns/**"
      - "crates/meshway-netns/**"
      - "crates/meshway-stun/**"
      - "crates/meshway-tun/**"
      - "crates/meshway-transport*/**"
      - "apps/meshway-daemon/**"
      - "apps/meshway-cli/**"
      - "apps/meshway-server/src/execution/**"
      - "apps/meshway-server/src/state/**"
      - "apps/meshway-server/src/netmap/**"
      - "apps/meshway-server/src/resources/**"
      - "apps/meshway-server/src/configuration/**"
      - "apps/meshway-server/src/store/execution/selection.rs"
      - "apps/meshway-server/src/store/netmap/**"
      - "apps/meshway-server/src/http/agent.rs"
      - "apps/meshway-server/src/http/nodes.rs"
      - "tools/meshway-runtime-fixture/**"
      - "tools/meshway-packet-fixture/**"
      - "tools/meshway-test-server/**"
      - "scripts/verify_*.py"
      - "scripts/validate_*.py"
      - "scripts/verification_sources.py"
      - "scripts/validation_support.py"
      - "scripts/node_lab.py"
      - "dev/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
    inputs:
      rows:
        description: "validate:matrix --rows (space separated); empty = full matrix"
        default: ""
      short:
        description: "diagnostic short mode"
        type: boolean
        default: false

# Runners may carry a personal global mise config; the project lockfile is the only tool source.
env:
  MISE_GLOBAL_CONFIG_ROOT: /nonexistent

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: [self-hosted, linux, x64, docker, cgroup2, planck]
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Reclaim evidence left root-owned by a cancelled matrix
        # Fixture containers write as root into the bind-mounted report; a run
        # killed mid-row never reaches its own chown, and checkout's clean then
        # fails with EACCES. No sudo on runners: fix ownership through Docker.
        run: |
          if [ -d "$GITHUB_WORKSPACE/.meshway" ]; then
            docker run --rm --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE \
              --security-opt no-new-privileges -v "$GITHUB_WORKSPACE/.meshway:/m" \
              alpine:3.20 chown -hR "$(id -u):$(id -g)" /m
          fi
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14
          install_args: --locked
      - run: mise run setup
      - name: Gate rows for pull requests (short mode)
        if: github.event_name == 'pull_request'
        run: mise run validate:matrix -- --short --rows nat/off nat+fallback/off
      - name: Nightly full matrix
        if: github.event_name == 'schedule'
        run: mise run validate:matrix
      - name: Dispatched matrix
        if: github.event_name == 'workflow_dispatch'
        run: mise run validate:matrix -- ${{ inputs.short && '--short' || '' }} ${{ inputs.rows && format('--rows {0}', inputs.rows) || '' }}
      - name: Publish summary and keep the evidence outside the checkout
        if: always()
        run: |
          latest=$(find .meshway/validation/matrix -mindepth 1 -maxdepth 1 -type d | sort -r | head -1)
          cat "$latest/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # The next checkout on this runner runs `git clean -ffdx`; full row
          # evidence (logs, pcap, reports) survives only here. Private key
          # material stays runner-local and is never uploaded.
          keep="$HOME/meshway-ci-evidence/validate/${{ github.run_id }}-$(basename "$latest")"
          mkdir -p "$(dirname "$keep")"
          cp -a "$latest" "$keep"
          echo "Evidence: $(hostname):$keep" >> "$GITHUB_STEP_SUMMARY"
          # A full matrix with pcap is ~4 GiB; keep the eight most recent runs.
          find "$(dirname "$keep")" -mindepth 1 -maxdepth 1 -type d | sort -r | tail -n +9 | xargs -r rm -rf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-matrix-${{ github.run_id }}
          path: |
            .meshway/validation/matrix/*/matrix.json
            .meshway/validation/matrix/*/summary.md
            .meshway/validation/matrix/*/rows/**/report.json
            .meshway/validation/matrix/*/rows/**/*.log
            .meshway/validation/matrix/*/rows/**/error.txt
            !**/private/**
            !**/*.pcap
            !**/*.pem
          if-no-files-found: ignore
