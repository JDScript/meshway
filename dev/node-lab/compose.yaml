name: meshway-node-lab

x-node: &node
  image: ${MESHWAY_NODE_IMAGE:?Run mise run node:lab image-build}
  pull_policy: never
  platform: ${MESHWAY_NODE_PLATFORM:?Run mise run node:lab deploy}
  restart: unless-stopped
  labels:
    io.meshway.node-lab: "1"
  environment:
    PATH: /opt/meshway:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    MESHWAY_SERVER_URL: https://meshway-dev-api.jdscript.dev
    RUST_LOG: info
    MESHWAY_PROFILE: ${MESHWAY_PROFILE:-0}
    MESHWAY_PROFILE_DETAIL: ${MESHWAY_PROFILE_DETAIL:-0}
    MESHWAY_LOG_FORMAT: json
    MESHWAY_NODE_LAB_OWNED: "1"
    MESHWAY_LAB_UPSTREAM_DNS: "1.1.1.1 8.8.8.8"
  command: ["--data-dir", "/var/lib/meshway", "--network-mode", "tun", "--bootstrap-nameserver", "1.1.1.1:53"]
  read_only: false
  tmpfs: ["/run:rw,nosuid,nodev,noexec,size=16m,mode=755"]
  cap_drop: [ALL]
  # Private mount setup; diagnostics; packaged service UID drop and cleanup.
  # SYS_PTRACE permits the DNS owner's /proc namespace check across resolved's UID.
  cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN, SYS_PTRACE, SETUID, SETGID, SETPCAP, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE]
  devices: ["/dev/net/tun:/dev/net/tun"]
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 0
    net.ipv6.conf.default.disable_ipv6: 0
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 512m
  pids_limit: 64
  stop_grace_period: 45s
  healthcheck:
    test: ["CMD", "/opt/meshway/meshway", "status", "--json", "--log-filter", "error"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  lax:
    <<: *node
    container_name: meshway-lax
    hostname: meshway-lax
    volumes:
      - type: bind
        source: ${MESHWAY_NODE_RELEASE:?Run mise run build:node:linux}
        target: /opt/meshway
        read_only: true
        bind: {create_host_path: false}
      - lax-state:/var/lib/meshway
  sha:
    <<: *node
    container_name: meshway-sha
    hostname: meshway-sha
    volumes:
      - type: bind
        source: ${MESHWAY_NODE_RELEASE:?Run mise run build:node:linux}
        target: /opt/meshway
        read_only: true
        bind: {create_host_path: false}
      - sha-state:/var/lib/meshway
  nyc:
    <<: *node
    container_name: meshway-nyc
    hostname: meshway-nyc
    volumes:
      - type: bind
        source: ${MESHWAY_NODE_RELEASE:?Run mise run build:node:linux}
        target: /opt/meshway
        read_only: true
        bind: {create_host_path: false}
      - nyc-state:/var/lib/meshway

volumes:
  lax-state:
    name: meshway-lax-state
    labels: {io.meshway.node-lab: "1"}
  sha-state:
    name: meshway-sha-state
    labels: {io.meshway.node-lab: "1"}
  nyc-state:
    name: meshway-nyc-state
    labels: {io.meshway.node-lab: "1"}

networks:
  default:
    name: meshway-node-lab
    labels: {io.meshway.node-lab: "1"}
