[package]
name = "meshway-apple-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "meshway-apple-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
meshway-control-client = { path = "../../../crates/control-client" }
meshway-protocol = { path = "../../../crates/protocol" }
meshway-policy = { path = "../../../crates/policy" }
uniffi = "=0.32.2"
tokio.workspace = true
thiserror = "2"
url = "2"
serde_json.workspace = true

[dev-dependencies]
meshway-controller = { path = "../../controller" }
axum.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

# Workspace forbid cannot be relaxed by generated UniFFI scaffolding. This
# audited FFI boundary uses deny: UniFFI's generated allow attributes may relax
# it locally; handwritten source contains no unsafe. Other crates stay forbid.
[lints.rust]
unsafe_code = "deny"
