[package]
name = "meshway-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "meshwayd"

[[bin]]
name = "meshwayd"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
getrandom.workspace = true
clap = { workspace = true, features = ["env"] }
meshway-configuration = { path = "../../crates/meshway-configuration" }
meshway-control = { path = "../../crates/meshway-control" }
meshway-underlay = { path = "../../crates/meshway-underlay" }
meshway-tun = { path = "../../crates/meshway-tun" }
meshway-connectivity = { path = "../../crates/meshway-connectivity" }
meshway-dataplane = { path = "../../crates/meshway-dataplane" }
meshway-diagnostics = { path = "../../crates/meshway-diagnostics" }
meshway-dns = { path = "../../crates/meshway-dns" }
meshway-ipc = { path = "../../crates/meshway-ipc" }
meshway-logging = { path = "../../crates/meshway-logging" }
meshway-model = { path = "../../crates/meshway-model" }
meshway-private-storage = { path = "../../crates/meshway-private-storage" }
meshway-protocol = { path = "../../crates/meshway-protocol" }
meshway-control-client = { path = "../../crates/meshway-control-client" }
meshway-serde = { path = "../../crates/meshway-serde" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustix = { workspace = true, features = ["system"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
meshway-server = { path = "../meshway-server" }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
