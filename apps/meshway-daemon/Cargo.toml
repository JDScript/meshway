[package]
name = "meshway-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "meshwayd"

[[bin]]
name = "meshwayd"
path = "src/main.rs"

[dependencies]
meshway-node = { path = "../../crates/meshway-node" }
clap = { workspace = true, features = ["env"] }
meshway-configuration = { path = "../../crates/meshway-configuration" }
meshway-dns = { path = "../../crates/meshway-dns" }
meshway-logging = { path = "../../crates/meshway-logging" }
meshway-private-storage = { path = "../../crates/meshway-private-storage" }
meshway-protocol = { path = "../../crates/meshway-protocol" }
meshway-service = { path = "../../crates/meshway-service" }
rustix.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false }

[dev-dependencies]
reqwest.workspace = true
chrono.workspace = true
getrandom.workspace = true
uuid.workspace = true
serde_json.workspace = true
meshway-control = { path = "../../crates/meshway-control" }
meshway-model = { path = "../../crates/meshway-model" }
meshway-control-client = { path = "../../crates/meshway-control-client" }
axum.workspace = true
meshway-server = { path = "../meshway-server" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
