[package]
name = "meshway-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "meshway"

[[bin]]
name = "meshway"
path = "src/main.rs"

[dependencies]
anstyle = "1"
chrono.workspace = true
clap.workspace = true
meshway-configuration = { path = "../../crates/meshway-configuration" }
meshway-dataplane = { path = "../../crates/meshway-dataplane" }
meshway-protocol = { path = "../../crates/meshway-protocol" }
meshway-logging = { path = "../../crates/meshway-logging" }
meshway-model = { path = "../../crates/meshway-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width = "0.2"

[dev-dependencies]
getrandom.workspace = true
uuid.workspace = true
axum.workspace = true
meshway-daemon = { path = "../meshway-daemon" }
meshway-server = { path = "../meshway-server" }
meshway-control-client = { path = "../../crates/meshway-control-client" }
meshway-protocol = { path = "../../crates/meshway-protocol" }
tempfile.workspace = true

[lints]
workspace = true
