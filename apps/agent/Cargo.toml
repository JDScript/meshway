[package]
name = "meshway-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "meshway-agent"

[features]
transport-runtime = ["dep:meshway-dataplane", "dep:meshway-transport-vless", "dep:meshway-agent-tun"]
transport-lab = ["transport-runtime"]
managed-connections = ["transport-runtime", "dep:meshway-agent-diagnostics", "dep:meshway-agent-dataplane", "dep:meshway-agent-dns", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rustls-native-certs", "dep:sha2", "dep:rustix", "dep:hickory-proto", "dep:bytes", "dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:socket2", "dep:tokio-util"]

[[bin]]
name = "meshway-carrier-measure"
path = "src/bin/carrier_measure.rs"
required-features = ["transport-lab"]

[dependencies]
meshway-agent-dns = { path = "../../crates/agent-dns", optional = true }
meshway-agent-dataplane = { path = "../../crates/agent-dataplane", optional = true }
meshway-agent-diagnostics = { path = "../../crates/agent-diagnostics", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
futures-util = "0.3"
getrandom.workspace = true
idna = "1.1"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"], optional = true }
ipnet = "2.11"
meshway-protocol = { path = "../../crates/protocol" }
meshway-control-client = { path = "../../crates/control-client" }
meshway-policy = { path = "../../crates/policy" }
meshway-dataplane = { path = "../../crates/dataplane", optional = true }
meshway-agent-tun = { path = "../../crates/agent-tun", optional = true }
meshway-transport-vless = { path = "../../crates/transport-vless", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["process", "io-util"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
rustix = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen = "0.14"
meshway-controller = { path = "../controller", features = ["latency-history-fixture"] }
axum.workspace = true
tempfile.workspace = true
rustix = { workspace = true, features = ["net"] }

[lints]
workspace = true
