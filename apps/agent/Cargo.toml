[package]
name = "meshway-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "meshway-agent"

[features]
transport-lab = ["dep:meshway-dataplane", "dep:meshway-transport-vless", "dep:tun-rs"]
managed-connections = ["transport-lab", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:sha2", "dep:rustix"]

[[bin]]
name = "meshway-carrier-measure"
path = "src/bin/carrier_measure.rs"
required-features = ["transport-lab"]

[dependencies]
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
futures-util = "0.3"
getrandom.workspace = true
idna = "1.1"
ipnet = "2.11"
meshway-protocol = { path = "../../crates/protocol" }
meshway-policy = { path = "../../crates/policy" }
meshway-dataplane = { path = "../../crates/dataplane", optional = true }
meshway-transport-vless = { path = "../../crates/transport-vless", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
reqwest-middleware = "0.5"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["process", "io-util"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
sha2 = { version = "0.10", optional = true }
rustix = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tun-rs = { version = "2.8.11", features = ["async_tokio"], optional = true }

[dev-dependencies]
rcgen = "0.14"
meshway-controller = { path = "../controller" }
axum.workspace = true
tempfile.workspace = true
rustix = { workspace = true, features = ["net"] }

[lints]
workspace = true
