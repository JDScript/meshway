[package]
name = "meshway-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "meshway-controller"

[features]
codegen = ["dep:openapi-to-rust"]

[dependencies]
axum.workspace = true
chrono.workspace = true
clap.workspace = true
meshway-protocol = { path = "../../crates/protocol" }
meshway-policy = { path = "../../crates/policy" }
serde.workspace = true
ipnet = "2.11"
idna = "1"
jsonc-parser = { version = "=0.33.1", features = ["serde"] }
url = "2"
rusqlite.workspace = true
thiserror = "2"
serde_json.workspace = true
tokio.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
openapi-to-rust = { version = "=0.19.0", default-features = false, optional = true }

[[bin]]
name = "generate-rust-client"
path = "src/bin/generate-rust-client.rs"
required-features = ["codegen"]

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
