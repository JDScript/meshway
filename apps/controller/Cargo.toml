[package]
name = "meshway-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "meshway-controller"

[features]
codegen = ["dep:openapi-to-rust"]
# Retained for existing fixture commands; schema 11 is installed in all builds.
latency-history-fixture = []

[dependencies]
argon2 = "0.5.3"
getrandom.workspace = true
sha2.workspace = true
zeroize = "1.8"
chacha20poly1305 = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
axum.workspace = true
chrono.workspace = true
clap.workspace = true
meshway-protocol = { path = "../../crates/protocol" }
meshway-policy = { path = "../../crates/policy" }
serde.workspace = true
ipnet = "2.11"
idna = "1"
jsonc-parser = { version = "=0.33.1", features = ["serde"] }
url = "2"
rusqlite.workspace = true
thiserror = "2"
serde_json.workspace = true
tokio.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
openapi-to-rust = { version = "=0.19.0", default-features = false, optional = true }

[[bin]]
name = "generate-rust-client"
path = "src/bin/generate-rust-client/main.rs"
required-features = ["codegen"]

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
