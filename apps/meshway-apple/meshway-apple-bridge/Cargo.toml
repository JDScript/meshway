[package]
name = "meshway-apple-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "meshway-apple-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[target.'cfg(target_os = "macos")'.dependencies]
meshway-node = { path = "../../../crates/meshway-node" }
meshway-protocol = { path = "../../../crates/meshway-protocol" }
meshway-model = { path = "../../../crates/meshway-model" }
meshway-configuration = { path = "../../../crates/meshway-configuration" }
meshway-control = { path = "../../../crates/meshway-control" }
chrono.workspace = true
serde_json.workspace = true
meshway-logging = { path = "../../../crates/meshway-logging" }
meshway-dns = { path = "../../../crates/meshway-dns" }
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
uniffi = { version = "=0.32.0", features = ["tokio"] }
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

# Generated ABI only; business code remains denied. See src/lib.rs.
[lints.rust]
unsafe_code = "deny"
