[package]
name = "meshway-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Meshway control plane based on the V2 configuration and state model"

[dependencies]
argon2 = "0.5.3"
axum.workspace = true
chacha20poly1305 = "0.10"
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
getrandom.workspace = true
hmac = "0.12"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
futures-util = "0.3"
idna = "1.1"
meshway-model = { path = "../../crates/meshway-model" }
meshway-configuration = { path = "../../crates/meshway-configuration" }
meshway-protocol = { path = "../../crates/meshway-protocol" }
meshway-transport-spec = { path = "../../crates/meshway-transport-spec" }
maxminddb = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
zeroize = "1.8"
base64 = "0.23"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
