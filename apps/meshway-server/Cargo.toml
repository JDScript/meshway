[package]
name = "meshway-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Meshway control plane based on the V2 configuration and state model"

[dependencies]
argon2 = "0.5.3"
axum.workspace = true
chacha20poly1305 = "0.10"
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
getrandom.workspace = true
hmac = "0.12"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
futures-util.workspace = true
idna.workspace = true
ipnet.workspace = true
meshway-model = { path = "../../crates/meshway-model" }
meshway-logging = { path = "../../crates/meshway-logging" }
meshway-private-storage = { path = "../../crates/meshway-private-storage" }
meshway-configuration = { path = "../../crates/meshway-configuration" }
meshway-policy = { path = "../../crates/meshway-policy" }
meshway-protocol = { path = "../../crates/meshway-protocol" }
meshway-transport = { path = "../../crates/meshway-transport" }
meshway-tls = { path = "../../crates/meshway-tls", features = ["platform-verifier"] }
meshway-stun = { path = "../../crates/meshway-stun" }
maxminddb = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
socket2.workspace = true
tracing.workspace = true
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors"] }
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
zeroize = "1.8"
base64 = "0.23"

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "query"] }
rustls.workspace = true
tempfile.workspace = true

[lints]
workspace = true
