[workspace]
members = [
    "apps/meshway-controller",
    "crates/model",
    "crates/configuration",
    "crates/control-client",
    "crates/protocol",
    "crates/serde",
    "crates/transport-spec",
]
resolver = "3"
# This isolated replacement baseline builds the new control plane only.
# Existing Agent/runtime consumers join after their contract adaptation.
exclude = ["apps/controller", "apps/agent", "apps/apple/core", "crates/vendor/socket2"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
getrandom = "0.3"
idna = "1.1"
ipnet = { version = "2.11", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3.0"
uuid = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
