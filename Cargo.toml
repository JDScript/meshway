[workspace]
members = [
    "apps/meshway-server",
    "apps/meshway-daemon",
    "apps/meshway-cli",
    "crates/meshway-model",
    "crates/meshway-engine",
    "crates/meshway-configuration",
    "crates/meshway-policy",
    "crates/meshway-dataplane",
    "crates/meshway-tun",
    "crates/meshway-underlay",
    "crates/meshway-connectivity",
    "crates/meshway-stun",
    "crates/meshway-dns",
    "crates/meshway-netns",
    "crates/meshway-control-client",
    "crates/meshway-protocol",
    "crates/meshway-private-storage",
    "crates/meshway-control",
    "crates/meshway-logging",
    "crates/meshway-transport",
    "crates/meshway-transport-stream",
    "crates/meshway-rules",
    "tools/meshway-transport-perf",
    "tools/meshway-desired-fixture",
    "tools/meshway-circuit-perf",
    "tools/meshway-crypto-bench",
    "tools/meshway-dataplane-perf",
    "tools/meshway-packet-fixture",
    "tools/meshway-runtime-fixture",
    "tools/meshway-test-server",
    "tools/meshway-netmap-perf",
    "tools/meshway-rules-cli",
    "tools/meshway-rules-perf",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.7"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
axum = "0.8.9"
bytes = "1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
getrandom = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
idna = "1.1"
ipnet = { version = "2.11", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-platform-verifier = { version = "0.7", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3.0"
uuid = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Real Server fixtures retain the production password work factor. Optimize the
# KDF implementation in tests rather than weakening authentication or reusing a
# mutable database between cases. Workspace code retains debug assertions.
[profile.test.package.argon2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3
