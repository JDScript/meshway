[workspace]
members = [
    "crates/protocol",
    "crates/policy",
    "crates/dataplane",
    "crates/agent-dns",
    "crates/agent-tun",
    "crates/agent-dataplane",
    "crates/agent-diagnostics",
    "crates/agent-connections",
    "crates/control-client",
    "crates/transport-vless",
    "crates/transport-trojan",
    "crates/transport-socks5",
    "crates/transport-shadowsocks",
    "apps/controller",
    "apps/agent",
    "apps/apple/core",
]
resolver = "3"
exclude = ["crates/vendor/socket2"]

[patch.crates-io]
# Auditable single-API extension; see crates/vendor/README.md.
socket2 = { path = "crates/vendor/socket2" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
getrandom = "0.3"
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
