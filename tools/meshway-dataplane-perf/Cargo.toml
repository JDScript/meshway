[package]
name = "meshway-dataplane-perf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Explicit layered TUN dataplane performance fixture"
default-run = "meshway-dataplane-perf"

[features]
allocator-mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "=0.1.52", optional = true, default-features = false, features = ["extended"] }
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
meshway-dataplane = { path = "../../crates/meshway-dataplane" }
meshway-connectivity = { path = "../../crates/meshway-connectivity" }
meshway-underlay = { path = "../../crates/meshway-underlay" }
meshway-private-storage = { path = "../../crates/meshway-private-storage" }
meshway-authority = { path = "../../crates/meshway-authority" }
meshway-engine = { path = "../../crates/meshway-engine" }
meshway-configuration = { path = "../../crates/meshway-configuration" }
meshway-model = { path = "../../crates/meshway-model" }
meshway-desired-fixture = { path = "../meshway-desired-fixture" }
meshway-logging = { path = "../../crates/meshway-logging" }
meshway-tun = { path = "../../crates/meshway-tun" }
meshway-transport = { path = "../../crates/meshway-transport" }
meshway-transport-udp = { path = "../../crates/meshway-transport-udp" }
meshway-transport-spec = { path = "../../crates/meshway-transport-spec" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zeroize = "1.8"

[lints]
workspace = true
