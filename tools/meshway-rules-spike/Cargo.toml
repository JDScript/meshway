# R0 spike: prototype rule-set binary format, loader and matcher. It is NOT a
# workspace member (own `[workspace]`, own lockfile/target) so the root
# manifest, lockfile and `mise run check` are untouched. The `server` feature
# links the real `meshway_server::resources::convert` to measure the current
# converter; benchmarks build without it.
[package]
name = "meshway-rules-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[features]
default = ["server"]
server = ["dep:meshway-server", "dep:meshway-configuration", "dep:meshway-policy", "dep:meshway-model"]

[dependencies]
aho-corasick = "1.1.5"
fst = "0.4.7"
idna = "1.1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
# R1 differential (`r1diff`) against the production crate.
meshway-rules = { path = "../../crates/meshway-rules", features = ["convert"] }
meshway-server = { path = "../../apps/meshway-server", optional = true }
meshway-configuration = { path = "../../crates/meshway-configuration", optional = true }
meshway-policy = { path = "../../crates/meshway-policy", optional = true }
meshway-model = { path = "../../crates/meshway-model", optional = true }

[profile.release]
debug = false
codegen-units = 1
lto = "thin"
