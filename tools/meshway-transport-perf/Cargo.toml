[package]
name = "meshway-transport-perf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Explicit raw versus Meshway datagram socket performance driver"

[dependencies]
meshway-model = { path = "../../crates/meshway-model" }
clap.workspace = true
hdrhistogram = { version = "7", default-features = false }
meshway-transport = { path = "../../crates/meshway-transport" }
meshway-transport-stream = { path = "../../crates/meshway-transport-stream" }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-util.workspace = true

[lints]
workspace = true
