[package]
name = "meshway-rules-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rule-set publishing CLI: convert, inspect, match, sign and verify catalogs (assembles meshway-rules)"

[[bin]]
name = "meshway-rules"
path = "src/main.rs"

[dependencies]
meshway-rules = { path = "../../crates/meshway-rules", features = ["convert", "catalog"] }
meshway-logging = { path = "../../crates/meshway-logging" }
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
