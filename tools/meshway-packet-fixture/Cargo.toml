[package]
name = "meshway-packet-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Explicit isolated conformance driver for protected Meshway TUN packet flow"

[dependencies]
meshway-engine = { path = "../../crates/meshway-engine" }
meshway-configuration = { path = "../../crates/meshway-configuration" }
meshway-policy = { path = "../../crates/meshway-policy" }
meshway-model = { path = "../../crates/meshway-model" }
meshway-protocol = { path = "../../crates/meshway-protocol" }
meshway-control-client = { path = "../../crates/meshway-control-client" }
meshway-control = { path = "../../crates/meshway-control" }
meshway-dataplane = { path = "../../crates/meshway-dataplane" }
meshway-transport = { path = "../../crates/meshway-transport" }
meshway-transport-spec = { path = "../../crates/meshway-transport-spec" }
meshway-transport-tcp = { path = "../../crates/meshway-transport-tcp" }
meshway-tun = { path = "../../crates/meshway-tun" }
meshway-tls = { path = "../../crates/meshway-tls" }
meshway-logging = { path = "../../crates/meshway-logging" }
meshway-server = { path = "../../apps/meshway-server" }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
clap.workspace = true
tokio = { workspace = true, features = ["io-util", "fs"] }
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
uuid.workspace = true
reqwest.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tracing.workspace = true

[lints]
workspace = true
