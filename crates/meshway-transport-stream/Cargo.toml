[package]
name = "meshway-transport-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Exact-trust TLS and the VLESS/Trojan TCP CONNECT encapsulations on injected byte streams"

[features]
platform-verifier = ["dep:rustls-platform-verifier"]

[dependencies]
bytes.workspace = true
futures-util.workspace = true
hex = "0.4"
meshway-model = { path = "../meshway-model" }
meshway-transport = { path = "../meshway-transport" }
rustls.workspace = true
rustls-pemfile.workspace = true
rustls-platform-verifier = { workspace = true, optional = true }
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid.workspace = true
zeroize = "1.8"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

[lints]
workspace = true
