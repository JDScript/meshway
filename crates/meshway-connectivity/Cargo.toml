[package]
name = "meshway-connectivity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded authorized Node stream connections and authenticated adjacency"

[dependencies]
meshway-authority = { path = "../meshway-authority" }
meshway-logging = { path = "../meshway-logging" }
meshway-configuration = { path = "../meshway-configuration" }
meshway-control = { path = "../meshway-control" }
meshway-model = { path = "../meshway-model" }
meshway-policy = { path = "../meshway-policy" }
meshway-protocol = { path = "../meshway-protocol" }
meshway-stun = { path = "../meshway-stun" }
meshway-dataplane = { path = "../meshway-dataplane" }
meshway-underlay = { path = "../meshway-underlay" }
meshway-transport = { path = "../meshway-transport" }
meshway-transport-spec = { path = "../meshway-transport-spec" }
meshway-transport-vless = { path = "../meshway-transport-vless" }
meshway-transport-trojan = { path = "../meshway-transport-trojan" }
tokio = { workspace = true, features = ["io-util"] }
tokio-util.workspace = true
futures-util.workspace = true
sha2.workspace = true
getrandom.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }

[dev-dependencies]
tempfile.workspace = true
meshway-private-storage = { path = "../meshway-private-storage" }
meshway-server = { path = "../../apps/meshway-server" }
meshway-control-client = { path = "../meshway-control-client" }
meshway-transport-udp = { path = "../meshway-transport-udp" }
axum.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
