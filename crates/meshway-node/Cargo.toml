[package]
name = "meshway-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
meshway-engine = { path = "../meshway-engine" }
meshway-rules = { path = "../meshway-rules" }
chrono.workspace = true
getrandom.workspace = true
ipnet.workspace = true
meshway-configuration = { path = "../meshway-configuration" }
meshway-control = { path = "../meshway-control" }
meshway-underlay = { path = "../meshway-underlay" }
meshway-tun = { path = "../meshway-tun" }
meshway-connectivity = { path = "../meshway-connectivity" }
meshway-dataplane = { path = "../meshway-dataplane" }
meshway-dns = { path = "../meshway-dns" }
meshway-model = { path = "../meshway-model" }
meshway-logging = { path = "../meshway-logging" }
meshway-private-storage = { path = "../meshway-private-storage" }
meshway-protocol = { path = "../meshway-protocol" }
meshway-control-client = { path = "../meshway-control-client" }
reqwest.workspace = true
rustix = { workspace = true, features = ["system"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["net"] }

[dev-dependencies]
meshway-test-server = { path = "../../tools/meshway-test-server" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
