[package]
name = "meshway-transport-vless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "VLESS TCP CONNECT over TLS and WebSocket on injected byte streams"

[dependencies]
meshway-transport = { path = "../meshway-transport" }
meshway-transport-spec = { path = "../meshway-transport-spec" }
meshway-tls = { path = "../meshway-tls" }
bytes.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
thiserror.workspace = true
subtle = "2"
uuid.workspace = true
zeroize = "1.8"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

[lints]
workspace = true
