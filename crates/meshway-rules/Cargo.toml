[package]
name = "meshway-rules"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Meshway rule-set format (MWRS): builder, verified loader, matcher, source converters and signed catalogs"

[features]
default = []
# Source parsers for sing-box source and mihomo/classical payloads.
convert = ["dep:serde_json", "dep:serde_yaml_ng"]
# Signed provider catalog (`index.json`) types, signing and verification.
catalog = ["convert", "dep:ed25519-dalek", "dep:chrono"]

[dependencies]
aho-corasick = "1.1.5"
# Exact pin: the builder's byte output is part of every artifact digest.
fst = { version = "=0.4.7", default-features = false }
idna.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
chrono = { workspace = true, optional = true }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"], optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml_ng = { version = "0.10", optional = true }

[dev-dependencies]
fst = { version = "=0.4.7", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json.workspace = true

[lints]
workspace = true
