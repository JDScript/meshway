[package]
name = "meshway-configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Meshway configuration contracts, normalization, serialization and execution deltas"

[dependencies]
ipnet.workspace = true
jsonc-parser = { version = "=0.33.1", features = ["serde"] }
meshway-model = { path = "../meshway-model" }
meshway-rules = { path = "../meshway-rules" }
meshway-transport = { path = "../meshway-transport" }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
# Runtime hardware SHA-256 for canonical digests of whole netmaps.
sha2-fast = { package = "sha2", version = "0.11", features = ["zeroize"] }
thiserror.workspace = true
utoipa.workspace = true
zeroize = "1.8"

[lints]
workspace = true
