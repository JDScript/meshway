[package]
name = "meshway-configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Meshway configuration contracts, normalization, serialization and execution deltas"

[dependencies]
chrono.workspace = true
ipnet.workspace = true
jsonc-parser = { version = "=0.33.1", features = ["serde"] }
meshway-model = { path = "../meshway-model" }
meshway-serde = { path = "../meshway-serde" }
meshway-transport-spec = { path = "../meshway-transport-spec" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
utoipa.workspace = true
zeroize = "1.8"

[lints]
workspace = true
