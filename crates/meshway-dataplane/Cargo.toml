[package]
name = "meshway-dataplane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared L3 packet admission and stateful path execution for Meshway nodes"

[dependencies]
meshway-logging = { path = "../meshway-logging" }
meshway-configuration = { path = "../meshway-configuration" }
meshway-policy = { path = "../meshway-policy" }
meshway-model = { path = "../meshway-model" }
meshway-transport-spec = { path = "../meshway-transport-spec" }
meshway-control = { path = "../meshway-control" }
meshway-transport = { path = "../meshway-transport" }
meshway-tun = { path = "../meshway-tun" }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
sha2.workspace = true
zeroize = "1.8"
getrandom.workspace = true

[dev-dependencies]
axum.workspace = true
meshway-control-client = { path = "../meshway-control-client" }
meshway-protocol = { path = "../meshway-protocol" }
meshway-server = { path = "../../apps/meshway-server" }
meshway-dns = { path = "../meshway-dns" }
meshway-transport-tcp = { path = "../meshway-transport-tcp" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempfile.workspace = true
serde_json.workspace = true
uuid.workspace = true
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }

[lints]
workspace = true
