[package]
name = "meshway-control-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytes.workspace = true
futures-util.workspace = true
meshway-protocol = { path = "../meshway-protocol" }
meshway-tls = { path = "../meshway-tls", features = ["platform-verifier"] }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["stream"] }
reqwest-middleware = "0.5"

[dev-dependencies]
axum.workspace = true
meshway-server = { path = "../../apps/meshway-server" }
meshway-transport-spec = { path = "../meshway-transport-spec" }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls.workspace = true
tokio.workspace = true
tempfile.workspace = true

[lints]
workspace = true
