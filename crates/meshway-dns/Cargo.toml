[package]
name = "meshway-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DNS wire handling and published configuration selection for Node hosts"

[dependencies]
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
meshway-configuration = { path = "../meshway-configuration" }
meshway-policy = { path = "../meshway-policy" }
meshway-engine = { path = "../meshway-engine" }
meshway-dataplane = { path = "../meshway-dataplane" }
meshway-model = { path = "../meshway-model" }
meshway-protocol = { path = "../meshway-protocol" }
meshway-private-storage = { path = "../meshway-private-storage" }
meshway-serde = { path = "../meshway-serde" }
tokio = { workspace = true, features = ["io-util"] }
thiserror.workspace = true
bytes.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
ipnet.workspace = true
sha2.workspace = true
resolv-conf = "=0.7.6"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
rustix = { workspace = true, features = ["fs", "process", "net"] }

[dev-dependencies]
meshway-netmap-fixture = { path = "../../tools/meshway-netmap-fixture" }
meshway-control = { path = "../meshway-control" }
axum.workspace = true
meshway-control-client = { path = "../meshway-control-client" }
meshway-server = { path = "../../apps/meshway-server" }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
