[package]
name = "meshway-transport-udp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native UDP provider with explicit truncation and source metadata"

[dependencies]
meshway-logging = { path = "../meshway-logging" }
meshway-transport = { path = "../meshway-transport" }
meshway-transport-spec = { path = "../meshway-transport-spec" }
rustix = { workspace = true, features = ["net"] }
socket2.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["net", "socket", "uio"] }

[lints]
workspace = true
