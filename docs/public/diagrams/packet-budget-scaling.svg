<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Packet 开销：网络节点数 N 与路径边数 H 是两个维度</title>
  <desc id="desc">当前 v4 每段开销不随全网 N 增长，但1280-byte IPv4 TCP包、7-byte listener key时，路径一条边的首末段均新增128字节，两条边144和139，四条边176和161，七条边224和194。定长目标将路径、权限和密钥绑定留在本地上下文，每段传固定大小的选择、序号、密文和认证；具体证明方案尚未决定。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#475569"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:23px;font-weight:700}.h{font-size:20px;font-weight:650}.t{font-size:17px}.s{font-size:15px;fill:#475569}.num{font-size:25px;font-weight:700}</style>
  </defs>
  <rect width="1120" height="720" rx="18" fill="#f8fafc"/>
  <text x="30" y="40" class="title">固定每段的字节预算，另算路径与状态的成本</text>
  <text x="30" y="69" class="s">当前 v4：IPv4/TCP，所有 listener key 为7 bytes。下面数字是额外封装，不含原 IP 包 P 或外层 IP/UDP。</text>
  <rect x="30" y="94" width="515" height="78" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="50" y="125" class="h">N · 全网节点数</text>
  <text x="50" y="154" class="t">增加无关节点 → 同一条路径的 packet 不变大</text>
  <rect x="565" y="94" width="525" height="78" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="585" y="125" class="h">H · 本次路径边数</text>
  <text x="585" y="154" class="t">当前 carrier 前缀与 MAC 列仍随路径长度变化</text>
  <text x="30" y="212" class="h">当前：路径拉长，每段头也变大</text>
  <g fill="#fff" stroke="#cbd5e1">
    <rect x="30" y="231" width="250" height="99" rx="10"/><rect x="300" y="231" width="250" height="99" rx="10"/>
    <rect x="570" y="231" width="250" height="99" rx="10"/><rect x="840" y="231" width="250" height="99" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="155" y="260" class="t">H=1 · 2节点</text><text x="155" y="293" class="num">128 / 128 B</text><text x="155" y="317" class="s">首段 / 末段新增</text>
    <text x="425" y="260" class="t">H=2 · 3节点</text><text x="425" y="293" class="num">144 / 139 B</text><text x="425" y="317" class="s">首段 / 末段新增</text>
    <text x="695" y="260" class="t">H=4 · 5节点</text><text x="695" y="293" class="num">176 / 161 B</text><text x="695" y="317" class="s">首段 / 末段新增</text>
    <text x="965" y="260" class="t">H=7 · 8节点</text><text x="965" y="293" class="num">224 / 194 B</text><text x="965" y="317" class="s">首段 / 末段新增</text>
  </g>
  <text x="30" y="374" class="h">讨论目标：每段 P + C，C 与 N / H / 活动会话数无关</text>
  <rect x="30" y="396" width="500" height="138" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="50" y="426" class="h">本地已认证、仍有效的上下文</text>
  <text x="50" y="456" class="t">原始源 / 目标、完整路径、角色与实际邻居</text>
  <text x="50" y="484" class="t">业务绑定、keys / replay、期限 / 取消、回复路径</text>
  <text x="50" y="514" class="s">来自执行资格与真实准入；观测 State 不授予权限</text>
  <rect x="605" y="396" width="485" height="138" rx="12" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="625" y="426" class="h">线上 Data · 定长目标</text>
  <text x="625" y="456" class="t">固定 selector / 方向 / 序号 / 认证信息</text>
  <text x="625" y="484" class="t">+ 端到端 ciphertext(P)</text>
  <text x="625" y="514" class="s">必要 metadata 另列；不逐跳追加节点或证明列表</text>
  <path d="M605 465H535" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="565" y="448" text-anchor="middle" class="s">查找</text>
  <rect x="30" y="562" width="1060" height="126" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="50" y="592" class="h">固定字节目标 ≠ 已经有同语义的定长路径证明</text>
  <text x="50" y="621" class="t">相邻认证、原始发送者认证、完整路径参与证明分别定责；C 的确切数值尚未决定。</text>
  <text x="50" y="648" class="t">每段固定也仍需走 H 段：总传输量至少 H × (P + C)，setup 与本地状态单独计费。</text>
  <text x="50" y="674" class="s">固定 selector 只是 lookup；必须验证包自身并检查有效性，不能让旧包重绑新权限。</text>
</svg>
