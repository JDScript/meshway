<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Meshway candidate-v4：A 经 R 到 B 的加密与认证边界</title>
  <desc id="desc">Server 在控制路径提供身份、完整路径和执行许可。A 与 B 使用端到端 Noise；R 验证路径 MAC 和公开 PacketFacts，转发同一份 ciphertext。回复使用 B 到 R 到 A 的原反向路径。Native UDP 的相邻认证握手和健康探测独立于业务数据帧。</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#2563eb"/></marker>
    <marker id="violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#7c3aed"/></marker>
    <marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:23px;font-weight:700}.h{font-size:20px;font-weight:650}.t{font-size:17px}.s{font-size:15px;fill:#475569}.label{font-size:16px;font-weight:650}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}</style>
  </defs>
  <rect width="1120" height="690" rx="18" fill="#f8fafc"/>
  <text x="30" y="40" class="title">一条业务 circuit，两类认证范围</text>
  <text x="30" y="68" class="s">示例：Native UDP，完整逻辑路径 A → R → B；绘制逻辑边界，不表示物理地理位置。</text>
  <rect x="300" y="92" width="520" height="64" rx="12" fill="#e2e8f0"/>
  <text x="560" y="119" text-anchor="middle" class="h">Server → 各节点的 Control</text>
  <text x="560" y="143" text-anchor="middle" class="s">身份 / 注册公钥 / 授权与完整路径 / 有限执行资格</text>
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)">
    <path d="M370 156V179H180V205"/><path d="M560 156V205"/><path d="M750 156V179H940V205"/>
  </g>
  <rect x="30" y="205" width="300" height="306" rx="14" class="box"/>
  <rect x="410" y="205" width="300" height="306" rx="14" class="box"/>
  <rect x="790" y="205" width="300" height="306" rx="14" class="box"/>
  <text x="52" y="239" class="h">A · 业务源</text>
  <text x="432" y="239" class="h">R · 必经中继</text>
  <text x="812" y="239" class="h">B · 业务终点</text>
  <text x="52" y="274" class="t">Kernel → TUN → IP 包</text>
  <text x="52" y="304" class="t">源授权 / Flow / 原路径</text>
  <rect x="49" y="325" width="262" height="60" rx="9" fill="#ccfbf1"/>
  <text x="180" y="350" text-anchor="middle" class="label">Noise：整个 IP 包加密</text>
  <text x="180" y="373" text-anchor="middle" class="s">使用 A ↔ B 的端到端状态</text>
  <text x="52" y="417" class="t">给 R、B 各一列路径 MAC</text>
  <text x="52" y="448" class="t">捕获通道与独立输出 guard</text>
  <text x="52" y="481" class="s">明文只在本机受信边界中存在</text>
  <text x="432" y="274" class="t">检查自己的完整前缀 MAC</text>
  <text x="432" y="304" class="t">公开 PacketFacts → policy / Flow</text>
  <rect x="429" y="325" width="262" height="60" rx="9" fill="#ccfbf1"/>
  <text x="560" y="350" text-anchor="middle" class="label">转发同一份 ciphertext</text>
  <text x="560" y="373" text-anchor="middle" class="s">不做 IP payload 的解密 / 再加密</text>
  <text x="432" y="417" class="t">移除 R 列，更新 B 列 MAC</text>
  <text x="432" y="448" class="t">加入本跳实际 carrier</text>
  <text x="432" y="481" class="s">仍逐包检查资格、期限和最终 I/O</text>
  <text x="812" y="274" class="t">重算 A、R 对 B 的 MAC 链</text>
  <text x="812" y="304" class="t">重放预检；确认 circuit 资格</text>
  <rect x="809" y="325" width="262" height="60" rx="9" fill="#ccfbf1"/>
  <text x="940" y="350" text-anchor="middle" class="label">Noise：解密、解析真实 IP 包</text>
  <text x="940" y="373" text-anchor="middle" class="s">解密后精确核对 PacketFacts</text>
  <text x="812" y="417" class="t">Flow 准入 → 原 guard → TUN</text>
  <text x="812" y="448" class="t">最终检查后提交 replay</text>
  <text x="812" y="481" class="s">只有终点接受才构成端到端处理</text>
  <g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"><path d="M330 349H410"/><path d="M710 349H790"/></g>
  <text x="369" y="333" text-anchor="middle" class="s">正向</text><text x="749" y="333" text-anchor="middle" class="s">正向</text>
  <path d="M940 512V550H180V512" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#violet)"/>
  <text x="560" y="540" text-anchor="middle" class="label" style="fill:#6d28d9">回复 B → R → A：方向独立的 Noise / MAC keys / nonce / replay；使用原路径</text>
  <rect x="30" y="577" width="1060" height="85" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="49" y="605" class="label">不要把不同层的认证都算成“每跳再次加密 IP 包”</text>
  <text x="49" y="632" class="t">MWADJ：相邻通道握手与 UDP 健康证明；circuit 握手：Noise + 签名临时贡献。</text>
  <text x="49" y="654" class="s">稳态 Native UDP 数据帧：端到端 ciphertext + 逐验证者 MAC。选 TLS 等外层加密时，才另算该 provider 的保护。</text>
</svg>
